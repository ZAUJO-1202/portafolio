<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Portafolio</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="shortcut icon" href="assets/img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Mauro Rios | Portafolio" />
    <link rel="manifest" href="assets/img/site.webmanifest" />

    <!-- Google Fonts: Bowlby One + Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --cyan: #2DCDFF; --dark: #171717; --white: #FFFFFF;
            --cyan-dim: rgba(45,205,255,0.15);
            --cyan-glow: rgba(45,205,255,0.3);
            --radius: 16px; --radius-lg: 24px; --container: 1200px;
            --font-display: 'Bowlby One', sans-serif;
            --font-body: 'Outfit', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            background: var(--dark);
            color: var(--white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { width: min(calc(100% - 40px), var(--container)); margin: 0 auto; }

        /* Header */
        .admin-header {
            background: rgba(23,23,23,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(45,205,255,0.1);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 70px;
            display: flex;
            align-items: center;
        }
        .admin-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h2 {
            font-family: var(--font-body);
            font-size: 1.1rem;
            color: var(--cyan);
            letter-spacing: 0.04em;
            margin: 0;
        }
        .btn-logout {
            background: rgba(45,205,255,0.1);
            border: 1px solid rgba(45,205,255,0.2);
            color: var(--cyan);
            padding: 10px 20px;
            border-radius: 999px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.06em;
        }
        .btn-logout:hover {
            background: rgba(45,205,255,0.2);
            border-color: var(--cyan);
        }

        /* Login Form */
        #loginForm {
            max-width: 420px;
            margin: 100px auto;
            background: rgba(45,205,255,0.04);
            border: 1px solid rgba(45,205,255,0.15);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            text-align: center;
        }
        #loginForm h3 {
            font-family: var(--font-body);
            font-size: 1.2rem;
            color: var(--white);
            margin-bottom: 24px;
            letter-spacing: 0.04em;
        }
        .field {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
            text-align: left;
        }
        .field label {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
        }
        .field input, .field textarea, .field select {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid rgba(45,205,255,0.15);
            background: rgba(255,255,255,0.05);
            color: var(--white);
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .field input:focus, .field textarea:focus, .field select:focus {
            border-color: var(--cyan);
        }
        .field input[type="file"] {
            padding: 10px;
        }
        .field input[type="checkbox"] {
            width: auto;
        }
        .field select option {
            background: var(--cyan);
            color: var(--white);
        }
        .field textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Buttons */
        .btn-primary {
            background: rgba(45,205,255,0.15);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 12px 24px;
            border-radius: 999px;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.04em;
            width: 100%;
        }
        .btn-primary:hover {
            background: rgba(45,205,255,0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(45,205,255,0.15);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Admin Content */
        #adminContent {
            display: none;
            padding: 40px 0;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .full-width { grid-column: 1 / -1; }

        /* Cards */
        .admin-card {
            background: rgba(45,205,255,0.04);
            border: 1px solid rgba(45,205,255,0.12);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            transition: border-color 0.3s ease;
        }
        .admin-card:hover {
            border-color: rgba(45,205,255,0.25);
        }
        .admin-card h3 {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--white);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        .admin-card .card-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--cyan);
        }
        .checkbox-row label {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            margin: 0;
        }

        @media (max-width: 860px) {
            .admin-grid { grid-template-columns: 1fr; }
            #loginForm { margin: 60px 20px; }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <h2>✦ Panel de Control</h2>
            <button class="btn-logout" onclick="firebase.auth().signOut()">Cerrar Sesión</button>
        </div>
    </header>

    <div class="container">
        <!-- Login -->
        <div id="loginForm">
            <h3>Acceso Administrador</h3>
            <div class="field">
                <label>Email</label>
                <input type="email" id="adminEmail" placeholder="admin@correo.com">
            </div>
            <div class="field">
                <label>Contraseña</label>
                <input type="password" id="adminPass" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="login()">Entrar al Panel</button>
        </div>

        <!-- Panel -->
        <div id="adminContent">
            <div class="admin-grid">
                <!-- Nuevo Certificado -->
                <div class="admin-card">
                    <h3>📜 Nuevo Certificado</h3>
                    <p class="card-desc">Registra un nuevo certificado en tu portafolio.</p>
                    <div class="field">
                        <label>Nombre del Certificado</label>
                        <input type="text" id="cName" placeholder="Ej: Especialista en Blender">
                    </div>
                    <div class="field">
                        <label>Fecha de Expedición</label>
                        <input type="date" id="cDate">
                    </div>
                    <div class="field">
                        <label>Archivo PDF</label>
                        <input type="file" id="cFile" accept=".pdf">
                    </div>
                    <button class="btn-primary" onclick="addCertificate()">Subir Certificado</button>
                </div>

                <!-- Nuevo Proyecto -->
                <div class="admin-card">
                    <h3>🚀 Nuevo Proyecto</h3>
                    <p class="card-desc">Agrega un proyecto al carrusel del portafolio.</p>
                    <div class="field">
                        <label>Título</label>
                        <input type="text" id="pTitle" placeholder="Nombre del proyecto">
                    </div>
                    <div class="field">
                        <label>Entidad / Categoría</label>
                        <input type="text" id="pEntidad" placeholder="Ej: FABLAB – UFPS">
                    </div>
                    <div class="field">
                        <label>Descripción</label>
                        <textarea id="pDesc" rows="3" placeholder="Breve descripción..."></textarea>
                    </div>
                    <div class="field">
                        <label>Categoría</label>
                        <select id="pCat">
                            <option value="3d">Modelado 3D</option>
                            <option value="web">Desarrollo Web</option>
                            <option value="motion">Motion Graphics</option>
                            <option value="branding">Branding</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Etiquetas</label>
                        <input type="text" id="pTags" placeholder="GLB, Blender, UI (separar por comas)">
                    </div>
                    <div class="field">
                        <label>Portada (Imagen)</label>
                        <input type="file" id="pThumb">
                    </div>
                    
                    <div class="checkbox-row">
                        <input type="checkbox" id="isExternal">
                        <label for="isExternal">¿Es un enlace externo? (Web/Video)</label>
                    </div>
                    <div class="field" id="fileGroup">
                        <label>Archivo 3D (.glb)</label>
                        <input type="file" id="pModel" accept=".glb">
                    </div>
                    <div class="field" id="linkGroup" style="display: none;">
                        <label>Vínculo del recurso</label>
                        <input type="url" id="pLink" placeholder="https://...">
                    </div>

                    <button class="btn-primary" onclick="addProject()">Publicar Proyecto</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDXxGKVMkytpiyclCvuZv0I3BWigPS4haY",
            authDomain: "proyectos-fb5f4.firebaseapp.com",
            projectId: "proyectos-fb5f4",
            storageBucket: "proyectos-fb5f4.appspot.com",
            messagingSenderId: "767346559996",
            appId: "1:767346559996:web:97341f80b654f1e015c079"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Cloudinary
        const CLOUDINARY_BASE_URL = "https://api.cloudinary.com/v1_1/dbzqbh5wv";
        const CLOUDINARY_PRESET = "portafolio_preset";

        async function uploadToCloudinary(file, resourceType = 'auto') {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_PRESET);
            const url = `${CLOUDINARY_BASE_URL}/${resourceType}/upload`;
            const response = await fetch(url, { method: 'POST', body: formData });
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'Error al subir a Cloudinary');
            }
            const data = await response.json();
            return data.secure_url;
        }

        // Toggle archivo/link
        document.getElementById('isExternal').addEventListener('change', (e) => {
            document.getElementById('fileGroup').style.display = e.target.checked ? 'none' : 'block';
            document.getElementById('linkGroup').style.display = e.target.checked ? 'block' : 'none';
        });

        // Auth
        firebase.auth().onAuthStateChanged(user => {
            document.getElementById('loginForm').style.display = user ? 'none' : 'block';
            document.getElementById('adminContent').style.display = user ? 'block' : 'none';
        });

        async function login() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            try { await firebase.auth().signInWithEmailAndPassword(email, pass); }
            catch (e) { alert("Error: " + e.message); }
        }

        async function addProject() {
            const thumbFile = document.getElementById('pThumb').files[0];
            const modelFile = document.getElementById('pModel').files[0];
            const isExternal = document.getElementById('isExternal').checked;
            const linkUrl = document.getElementById('pLink').value.trim();
            const btn = document.querySelector('button[onclick="addProject()"]');
            
            if (!thumbFile) { alert("La imagen de portada es obligatoria"); return; }
            btn.disabled = true; btn.textContent = "Publicando...";

            try {
                const portadaUrl = await uploadToCloudinary(thumbFile);
                let archivoUrl = "", externalLink = "";
                if (isExternal) { externalLink = linkUrl; }
                else if (modelFile) { archivoUrl = await uploadToCloudinary(modelFile, 'raw'); }

                await db.collection('proyectos').add({
                    titulo: document.getElementById('pTitle').value,
                    entidad: document.getElementById('pEntidad').value,
                    descripcion: document.getElementById('pDesc').value,
                    categoria: document.getElementById('pCat').value,
                    portadaUrl, archivoUrl, externalLink,
                    fecha: firebase.firestore.FieldValue.serverTimestamp(),
                    tags: document.getElementById('pTags').value.split(',').map(t => t.trim()).filter(t => t !== "")
                });
                alert("Proyecto añadido con éxito");
                ['pTitle','pEntidad','pDesc','pTags','pThumb','pModel','pLink'].forEach(id => document.getElementById(id).value = '');
                document.getElementById('isExternal').checked = false;
                document.getElementById('fileGroup').style.display = 'block';
                document.getElementById('linkGroup').style.display = 'none';
            } catch (e) { alert("Error: " + e.message); }
            finally { btn.disabled = false; btn.textContent = "Publicar Proyecto"; }
        }

        async function addCertificate() {
            const nombre = document.getElementById('cName').value.trim();
            const fechaInput = document.getElementById('cDate').value;
            const file = document.getElementById('cFile').files[0];
            const btn = document.querySelector('button[onclick="addCertificate()"]');
            if (!nombre || !fechaInput || !file) { alert("Todos los campos son obligatorios"); return; }
            btn.disabled = true; btn.textContent = "Subiendo...";
            try {
                const parts = fechaInput.split('-');
                const fechaExpedicion = new Date(parts[0], parts[1] - 1, parts[2]);
                const pdfUrl = await uploadToCloudinary(file, 'auto');
                await db.collection('certificados').add({
                    nombre, fechaExpedicion, pdfUrl,
                    fechaRegistro: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Certificado añadido con éxito");
                document.getElementById('cName').value = '';
                document.getElementById('cDate').value = '';
                document.getElementById('cFile').value = '';
            } catch (e) { alert("Error: " + e.message); }
            finally { btn.disabled = false; btn.textContent = "Subir Certificado"; }
        }
    </script>
</body>
</html>
